name: Plaza Lama QA

on:
  push:
    paths:
      - 'plaza-lama/**'
      - '.github/workflows/plaza-lama-qa.yml'
  workflow_dispatch:

jobs:
  interaction-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install Selenium
        run: python3 -m pip install --quiet selenium

      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/plaza-http.log 2>&1 &
          sleep 2

      - name: Run mobile and desktop customer journeys
        run: |
          cat > /tmp/qa.py <<'PY'
          import time, sys
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.action_chains import ActionChains

          URL='http://127.0.0.1:8000/plaza-lama/'
          failures=[]
          checks=0

          def ok(cond,msg):
              global checks
              checks += 1
              if not cond:
                  failures.append(msg)
                  print('FAIL:',msg)
              else:
                  print('PASS:',msg)

          def wait():
              time.sleep(.18)

          def click(driver, css, label):
              els=driver.find_elements(By.CSS_SELECTOR,css)
              ok(bool(els), 'exists: '+label)
              if not els: return None
              driver.execute_script("arguments[0].scrollIntoView({block:'center'});",els[0])
              driver.execute_script("arguments[0].click();",els[0])
              wait()
              return els[0]

          def setup(width,height):
              o=Options()
              o.add_argument('--headless=new')
              o.add_argument('--no-sandbox')
              o.add_argument('--disable-dev-shm-usage')
              o.add_argument('--disable-gpu')
              o.add_argument('--window-size=%d,%d'%(width,height))
              o.set_capability('goog:loggingPrefs', {'browser':'ALL'})
              d=webdriver.Chrome(options=o)
              d.set_window_size(width,height)
              d.get(URL)
              time.sleep(.5)
              return d

          def go_airbnb(d):
              click(d,'[data-nav="guide"]','Resuelve nav')
              click(d,'[data-one="airbnb"]','Airbnb option')
              click(d,'#wholeNext','Step 1 continue')
              # space
              for css,label in [('[data-count="bedrooms"][data-value="2"]','2 bedrooms'),
                                ('[data-count="bathrooms"][data-value="2"]','2 bathrooms'),
                                ('[data-count="guests"][data-value="4"]','4 guests')]:
                  click(d,css,label)
              click(d,'#wholeNext','Step 2 continue')
              click(d,'#allSpaces','all spaces')
              click(d,'#wholeNext','Step 3 continue')
              click(d,'#ownNothing','own nothing')
              click(d,'#wholeNext','Step 4 continue')
              click(d,'[data-budget="500000"]','500k budget')
              click(d,'#wholeNext','Step 5 continue')
              wait()

          # Mobile
          d=setup(390,844)
          go_airbnb(d)
          ok('Tu Airbnb' in d.find_element(By.ID,'guideSheet').text,'result page title')
          pill=d.find_elements(By.CSS_SELECTOR,'.mobile-plan-pill')
          ok(bool(pill),'mobile plan pill visible')
          if pill:
              ok('Mi plan' in pill[0].text,'mobile plan pill has plan label')

          click(d,'[data-room="Comedor"]','Comedor tab')
          toolbar=d.find_elements(By.CSS_SELECTOR,'.room-toolbar')
          ok(bool(toolbar),'room toolbar rendered')
          click(d,'#viewAllRoom','Comedor Ver todo')
          cards=d.find_elements(By.CSS_SELECTOR,'.room-catalog-card')
          ok(len(cards)>=10,'Comedor has >=10 browsable products')
          filters=d.find_elements(By.CSS_SELECTOR,'.room-filter')
          ok(len(filters)>=4,'Comedor category filters render')

          # Favorite
          hearts=d.find_elements(By.CSS_SELECTOR,'.room-catalog-card .room-heart')
          ok(bool(hearts),'heart shown on room products')
          if hearts:
              d.execute_script("arguments[0].click();",hearts[0]); wait()
              ok('active' in hearts[0].get_attribute('class'),'heart toggles favorite')

          # Search within room
          search=d.find_elements(By.ID,'catalogSearch')
          ok(bool(search),'room catalog search exists')
          if search:
              search[0].send_keys('Plato'); wait()
              visible=[c for c in d.find_elements(By.CSS_SELECTOR,'.room-catalog-card') if c.is_displayed()]
              ok(len(visible)>=1,'room search filters products')
              search[0].clear(); wait()

          # Add/remove plan
          add=d.find_elements(By.CSS_SELECTOR,'.room-catalog-card .add-plan')
          ok(bool(add),'add-to-plan controls exist')
          if add:
              d.execute_script("arguments[0].click();",add[0]); wait()

          click(d,'#backToPlan','back from room catalog')
          click(d,'#openPlanDrawer','open mobile plan drawer')
          items=d.find_elements(By.CSS_SELECTOR,'#planDrawer .plan-item')
          ok(len(items)>=5,'plan drawer has multiple selected products')
          favtab=d.find_elements(By.CSS_SELECTOR,'#planDrawer [data-open-favs]')
          ok(bool(favtab),'favorites tab exists in planner')
          swipe=d.find_elements(By.CSS_SELECTOR,'#planDrawer .swipe-delete')
          ok(bool(swipe),'swipe-delete affordance exists')
          if swipe:
              before=len(items)
              d.execute_script("arguments[0].click();",swipe[0]); wait()
              undo=d.find_elements(By.ID,'undoSnack')
              ok(bool(undo),'delete shows undo snackbar')

          # close plan drawer if present
          close=d.find_elements(By.ID,'closePlanDrawer')
          if close: d.execute_script("arguments[0].click();",close[0]); wait()

          # Product detail and similar alternatives
          rows=d.find_elements(By.CSS_SELECTOR,'.room-product [data-room-product], .room-product')
          room_products=d.find_elements(By.CSS_SELECTOR,'.room-product')
          ok(bool(room_products),'room preview products render')
          if room_products:
              d.execute_script("arguments[0].click();",room_products[0]); wait()
              ok(bool(d.find_elements(By.ID,'detailOverlay')),'product detail overlay exists')
              similar=d.find_elements(By.ID,'detailSimilar')
              ok(bool(similar),'product detail has similar-options action')
              if similar:
                  d.execute_script("arguments[0].click();",similar[0]); wait()
                  ok(bool(d.find_elements(By.CSS_SELECTOR,'.alt-modal.show')),'alternatives view opens')
                  ok(bool(d.find_elements(By.CSS_SELECTOR,'.alt-live a')),'alternatives links to full Plaza Lama catalog')
                  close_alt=d.find_elements(By.ID,'closeAlt')
                  if close_alt:d.execute_script("arguments[0].click();",close_alt[0]);wait()

          logs=d.get_log('browser')
          severe=[x for x in logs if x.get('level')=='SEVERE' and 'Failed to load resource' not in x.get('message','')]
          ok(len(severe)==0,'no severe JavaScript console errors on mobile')
          if severe: print(severe)
          d.quit()

          # Desktop
          d=setup(1440,900)
          go_airbnb(d)
          rails=d.find_elements(By.CSS_SELECTOR,'.plan-rail')
          mains=d.find_elements(By.CSS_SELECTOR,'.room-main')
          ok(bool(rails) and bool(mains),'desktop split plan layout renders')
          if rails and mains:
              rx=rails[0].rect['x']; mx=mains[0].rect['x']
              ok(rx < mx,'plan rail is left of shopping area')
          click(d,'[data-room="Comedor"]','desktop Comedor tab')
          click(d,'#viewAllRoom','desktop Ver todo')
          ok(len(d.find_elements(By.CSS_SELECTOR,'.room-catalog-card'))>=10,'desktop room catalog populated')
          logs=d.get_log('browser')
          severe=[x for x in logs if x.get('level')=='SEVERE' and 'Failed to load resource' not in x.get('message','')]
          ok(len(severe)==0,'no severe JavaScript console errors on desktop')
          if severe: print(severe)
          d.quit()

          print('TOTAL CHECKS:',checks)
          if failures:
              print('FAILURES:', failures)
              sys.exit(1)
          print('ALL QA CHECKS PASSED')
          PY
          python3 /tmp/qa.py
